<div id="relation-frame-explainer">
  <style>
    #relation-frame-explainer{display:grid;gap:calc(var(--font-size-base)*.8);color:var(--foreground)}
    #relation-frame-explainer .relation-map{display:block;width:100%;height:390px;touch-action:none;overflow:visible}
    #relation-frame-explainer .relation-values{display:flex;gap:calc(var(--font-size-base)*1.3);flex-wrap:wrap}
    #relation-frame-explainer .relation-mark{fill:var(--viz-series-1);stroke:var(--background);stroke-width:2}
    #relation-frame-explainer .relation-ring{fill:none;stroke:var(--border);stroke-width:1;pointer-events:none}
    #relation-frame-explainer .relation-axis{stroke:var(--muted-foreground);stroke-width:1.2;fill:none;pointer-events:none}
    #relation-frame-explainer .relation-projection{stroke:var(--viz-series-1);stroke-width:1.2;stroke-dasharray:4 4;fill:none;pointer-events:none}
    #relation-frame-explainer .relation-vector{stroke:var(--viz-series-1);stroke-width:2;fill:none;pointer-events:none}
    #relation-frame-explainer .relation-label{fill:var(--foreground);font-weight:400;pointer-events:none}
    #relation-frame-explainer .relation-secondary{fill:var(--muted-foreground);pointer-events:none}
    #relation-frame-explainer .relation-fields{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--font-size-base)*.7)}
    #relation-frame-explainer .relation-target{cursor:grab}
    #relation-frame-explainer .relation-target:active{cursor:grabbing}
  </style>
  <h2>同一对物体，可以同时有几种关系</h2>
  <div class="viz-controls">
    <label class="form-label">展示方式
      <select id="relation-mode" class="form-select"><option value="labels">几何多标签</option><option value="compound">单个复合方位</option></select>
    </label>
    <label class="form-label">自车朝向 <span id="relation-yaw-value" class="tabular-nums">0°</span>
      <input id="relation-yaw" class="form-range" type="range" min="-180" max="180" step="5" value="0">
    </label>
    <button id="relation-swap" type="button" class="btn">互换 A / B</button>
  </div>
  <svg id="relation-map" class="relation-map" role="img" aria-label="俯视关系图。参考物B，目标A可拖动；默认A在B左3米、前4米。">
    <title>目标A相对参考B的关系</title><desc>邻近距离6米，方向有效距离12米，轴向分量死区1米。方向以自车朝向定义，距离单独计算。</desc>
    <defs><marker id="relation-arrow" orient="auto" markerWidth="9" markerHeight="9" refX="8" refY="4.5" markerUnits="userSpaceOnUse"><path d="M1 1L8 4.5 1 8" fill="none" stroke="var(--viz-series-1)" stroke-width="1.5"></path></marker></defs>
    <g id="relation-geometry"></g>
  </svg>
  <div class="relation-values tabular-nums" aria-live="polite">
    <span id="relation-result"></span><span id="relation-near"></span><span id="relation-distance"></span>
  </div>
  <div class="relation-values text-small tabular-nums"><span id="relation-delta"></span><span id="relation-dot"></span></div>
  <div class="relation-fields">
    <label class="form-label">A 世界 X（米）<input id="relation-x" class="form-control" type="number" min="-20" max="20" step=".5" value="-3"></label>
    <label class="form-label">A 世界 Y（米）<input id="relation-y" class="form-control" type="number" min="-20" max="20" step=".5" value="4"></label>
  </div>
</div>
<script>
(()=>{
  const root=document.getElementById('relation-frame-explainer');
  const svg=root.querySelector('#relation-map'),layer=root.querySelector('#relation-geometry');
  const yawInput=root.querySelector('#relation-yaw'),modeInput=root.querySelector('#relation-mode');
  const inputX=root.querySelector('#relation-x'),inputY=root.querySelector('#relation-y');
  let state={a:[-3,4],b:[0,0],yaw:0,mode:'labels'},width=736,height=390,scale=12,center=[368,195],dragging=false;
  const NS='http://www.w3.org/2000/svg';
  function el(type,attrs,parent=layer){const node=document.createElementNS(NS,type);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));parent.appendChild(node);return node;}
  function label(text,x,y,attrs={}){const node=el('text',{x,y,class:'relation-label',...attrs});node.textContent=text;return node;}
  function xy(world){return [center[0]+(world[0]-state.b[0])*scale,center[1]-(world[1]-state.b[1])*scale];}
  function calc(){const t=state.yaw*Math.PI/180,f=[-Math.sin(t),Math.cos(t)],left=[-Math.cos(t),-Math.sin(t)],d=[state.a[0]-state.b[0],state.a[1]-state.b[1]],distance=Math.hypot(...d),front=d[0]*f[0]+d[1]*f[1],side=d[0]*left[0]+d[1]*left[1];return {f,left,d,distance,front,side};}
  function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{target:state.a,reference:state.b,ego_yaw_degrees:state.yaw,display:state.mode},privateContent:state}).catch(()=>{});}
  function draw(){
    const c=calc();layer.replaceChildren();
    width=Math.max(280,svg.getBoundingClientRect().width||736);height=390;scale=Math.min((width-60)/28,12);center=[width/2,height/2];svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
    const [bx,by]=xy(state.b),[ax,ay]=xy(state.a);
    el('circle',{cx:bx,cy:by,r:12*scale,class:'relation-ring'});el('circle',{cx:bx,cy:by,r:6*scale,class:'relation-ring','stroke-dasharray':'5 4'});
    label('方向 ≤12m',bx+12*scale-3,by+22,{'text-anchor':'end',class:'relation-secondary text-small'});
    label('附近 ≤6m',bx+6*scale-4,by-10,{'text-anchor':'end',class:'relation-secondary text-small'});
    for(const axis of [c.f,c.left]){
      const end=[bx+axis[0]*13*scale,by-axis[1]*13*scale];
      el('line',{x1:bx-axis[0]*13*scale,y1:by+axis[1]*13*scale,x2:end[0],y2:end[1],class:'relation-axis'});
      label(axis===c.f?'前 f':'左 l',Math.max(26,Math.min(width-26,end[0])),Math.max(22,Math.min(height-14,end[1]-9)),{'text-anchor':'middle',class:'relation-secondary'});
      for(const k of [-1,1]){const p=[bx+axis[0]*scale*k,by-axis[1]*scale*k],perp=[axis[1],axis[0]];el('line',{x1:p[0]-perp[0]*4,y1:p[1]-perp[1]*4,x2:p[0]+perp[0]*4,y2:p[1]+perp[1]*4,class:'relation-axis'});}
    }
    const projected=[bx+c.f[0]*c.front*scale,by-c.f[1]*c.front*scale];
    el('line',{x1:bx,y1:by,x2:projected[0],y2:projected[1],class:'relation-projection'});
    el('line',{x1:projected[0],y1:projected[1],x2:ax,y2:ay,class:'relation-projection'});
    el('line',{x1:bx,y1:by,x2:ax,y2:ay,class:'relation-vector','marker-end':'url(#relation-arrow)'});
    el('rect',{x:bx-9,y:by-9,width:18,height:18,rx:3,fill:'var(--foreground)'});label('B 参考',bx+14,by+24);
    const target=el('circle',{cx:ax,cy:ay,r:12,class:'relation-mark relation-target','aria-label':'拖动目标A'});
    target.addEventListener('pointerdown',event=>{dragging=true;svg.setPointerCapture(event.pointerId);event.preventDefault();});
    label('A 目标',Math.max(30,Math.min(width-30,ax)),Math.max(20,Math.min(height-14,ay-20)),{'text-anchor':'middle'});
    const car=el('g',{transform:`translate(36 36) rotate(${-state.yaw})`});
    el('rect',{x:-8,y:-15,width:16,height:30,rx:5,fill:'var(--muted)',stroke:'var(--foreground)','stroke-width':1.2},car);
    el('line',{x1:-5,y1:-8,x2:5,y2:-8,stroke:'var(--foreground)','stroke-width':2},car);
    el('line',{x1:0,y1:-18,x2:0,y2:-29,stroke:'var(--viz-series-1)','marker-end':'url(#relation-arrow)'},car);
    label('自车朝向',12,76,{class:'relation-secondary text-small'});
    let horizontal='',vertical='';if(c.distance<=12&&c.distance>1e-9){horizontal=c.side>1?'左':c.side< -1?'右':'';vertical=c.front>1?'前':c.front< -1?'后':'';}
    const names=[horizontal?horizontal+'侧':null,vertical?vertical+'方':null].filter(Boolean);
    const composite=horizontal+vertical+(horizontal||vertical?'方':'');
    root.querySelector('#relation-result').textContent=state.mode==='compound'?`A 在 B 的 ${composite||'方向未判定'}`:`方向：${names.join(' · ')||'未判定'}`;
    root.querySelector('#relation-near').textContent=`距离属性：${c.distance>1e-9&&c.distance<=6?'附近':'非附近'}`;
    root.querySelector('#relation-distance').textContent=`d = ${c.distance.toFixed(2)} m`;
    root.querySelector('#relation-delta').textContent=`Δ = A − B = (${c.d[0].toFixed(1)}, ${c.d[1].toFixed(1)}) m`;
    root.querySelector('#relation-dot').textContent=`Δ·左 = ${c.side.toFixed(1)} m；Δ·前 = ${c.front.toFixed(1)} m；死区 ±1m`;
    root.querySelector('#relation-yaw-value').textContent=`${state.yaw}°`;yawInput.value=state.yaw;modeInput.value=state.mode;inputX.value=state.a[0];inputY.value=state.a[1];
    svg.setAttribute('aria-label',`目标A相对参考B：${names.join('、')||'方向未判定'}，距离${c.distance.toFixed(2)}米。`);
  }
  svg.addEventListener('pointermove',event=>{if(!dragging)return;const r=svg.getBoundingClientRect();state.a=[Math.round((state.b[0]+(event.clientX-r.left-center[0])/scale)*10)/10,Math.round((state.b[1]-(event.clientY-r.top-center[1])/scale)*10)/10];draw();});
  function stop(){if(dragging){dragging=false;save();}}svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
  yawInput.addEventListener('input',()=>{state.yaw=Number(yawInput.value);draw();});yawInput.addEventListener('change',save);
  modeInput.addEventListener('change',()=>{state.mode=modeInput.value;draw();save();});
  root.querySelector('#relation-swap').addEventListener('click',()=>{[state.a,state.b]=[state.b,state.a];draw();save();});
  for(const [input,index] of [[inputX,0],[inputY,1]])input.addEventListener('change',()=>{const value=Number(input.value);if(Number.isFinite(value)){state.a[index]=Math.max(-20,Math.min(20,value));draw();save();}});
  function restore(value){if(value&&Array.isArray(value.a)&&Array.isArray(value.b)&&value.a.length===2&&value.b.length===2&&[...value.a,...value.b,value.yaw].every(Number.isFinite)){state={a:value.a,b:value.b,yaw:value.yaw,mode:value.mode==='compound'?'compound':'labels'};}draw();}
  new ResizeObserver(draw).observe(svg);window.addEventListener('openai:set_globals',e=>{const value=e.detail?.globals?.widgetState;if(value)restore(value.privateContent||value);});restore(window.openai?.widgetState?.privateContent||window.openai?.widgetState);
})();
</script>
